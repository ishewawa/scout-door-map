<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#1d2a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Door Map">
<title>Scout Door Map</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: full screen map, slim top bar with season and tallies, bottom tab bar, panels slide up over the map */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#1d2a3a; --muted:#5d6b7c; --line:#d8dee6;
  --accent:#e2a400; --accent-ink:#2a1f00; --navy:#1d2a3a;
  --box:#ffffff; --outline:#334155;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f151d; --surface:#18212c; --ink:#e7edf4; --muted:#9aa8b8; --line:#2b3746;
  --accent:#f0b81c; --accent-ink:#231a00; --navy:#0b1118;
  --box:#0f151d; --outline:#cbd5e1; color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* top bar */
.top{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;display:flex;flex-direction:column;gap:6px;z-index:500}
.top-row{display:flex;align-items:center;gap:10px}
.brand{font:700 22px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.season-pill{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:5px 12px;font:700 15px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tally{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tally::-webkit-scrollbar{display:none}
.tchip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);border-radius:999px;padding:3px 9px 3px 6px;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tchip i{width:10px;height:10px;border-radius:3px;display:block;border:1px solid rgba(255,255,255,.5)}
.tchip b{font-weight:700}

/* map */
.mapwrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:var(--bg)}
.leaflet-container{font-family:var(--body)}
.fabs{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:10px;z-index:450}
.fab{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.fab svg{width:22px;height:22px}
.fab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.banner{color:var(--ink);cursor:pointer;position:absolute;left:12px;right:72px;top:64px;z-index:450;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.15);display:flex;gap:10px;align-items:center}
.banner .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.banner .spin{animation:none}}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:600;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 4px 14px rgba(0,0,0,.25)}

/* house labels */
.hl{background:none;border:0}
.hl-in{display:inline-flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:auto}
.hn{font:700 13px/1 var(--display);color:#111;background:rgba(255,255,255,.88);padding:2px 4px;border-radius:4px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.hn.none{color:#777;font-weight:600}
.dots{display:flex;gap:2px;margin-top:2px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;border:1px solid #fff;display:block;box-shadow:0 0 0 .5px rgba(0,0,0,.4)}
.dots i.empty{background:transparent!important;border-color:#666}
.ul div{display:flex;flex-direction:column;align-items:center}
.safe{display:flex;gap:10px;align-items:center;background:#e03131;color:#fff;padding:8px 16px;font-size:13px;font-weight:600;z-index:500}
.safe.ok{background:#2f9e44}
.safe span{flex:1;min-width:0}
.safe button{background:#fff;color:#111;border:0;border-radius:8px;padding:6px 10px;font-weight:700;white-space:nowrap}
.ul{background:none;border:0}
.ul div{transform:translate(-50%,-50%);font:700 11px/1 var(--display);color:#111;background:rgba(255,255,255,.85);padding:1px 3px;border-radius:3px;white-space:nowrap}
.mv{background:none;border:0}
.mv div{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.45);display:grid;place-items:center;font-size:24px;line-height:1}
.login{position:fixed;inset:0;z-index:950;background:var(--navy);display:grid;place-items:center;padding:16px;overflow:auto}
.login-card{width:100%;max-width:380px;background:var(--surface);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.login-brand{font:700 30px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.login-sub{margin:0 0 8px;color:var(--muted)}
.login-l{font-size:13px;font-weight:600;color:var(--muted);margin-top:6px}
.login-card input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px}
.login-card .btn{margin-top:12px;padding:13px}
.login-err{margin:4px 0 0;color:#e03131;font-weight:600;font-size:14px}
.login-skip{border:0;background:none;color:var(--muted);text-decoration:underline;padding:10px 0 0;font-size:13px}
.safe.sync{background:#1c7ed6}
.dl{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;transform:translate(-50%,-50%);background:#fff;color:#111;border-radius:7px;padding:3px 7px 4px;box-shadow:0 1px 4px rgba(0,0,0,.45);border:2px solid #e8590c;font:600 12px/1.2 var(--body);white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:auto}
.dl .a{font:700 13px/1.1 var(--display);letter-spacing:.02em}
.dl .ln b{font-weight:800}
.dl .u{color:#555;font-weight:700;margin-right:3px}
.dl .due{color:#c92a2a;font-weight:800}
.dl.done{border-color:#adb5bd;opacity:.6}
.dl.done .a::after{content:" \2713";color:#2f9e44}
.fab.truck.on{background:#ffb300;color:#2a1f00;border-color:#ffb300}
.dcard{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.dcard.done{opacity:.7}
.dcard h3{margin:0;font:700 20px/1.1 var(--display)}
.drow{display:flex;align-items:baseline;gap:10px;font-size:18px;font-weight:600}
.drow b{font:700 28px/1 var(--display);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.dpay{font-weight:700}
.dpay.due{color:#c92a2a}
.dpay.ok{color:#2f9e44}
.big-btn{width:100%;padding:14px;font-size:17px;font-weight:700;border-radius:12px;border:0;background:#ffb300;color:#2a1f00}
.big-btn.undo{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.prod-row input.pc{width:62px;flex:none;text-transform:uppercase;text-align:center;padding-inline:4px}
.search{position:absolute;left:12px;right:12px;top:10px;z-index:460}
.search .box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 6px 0 12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.search .box svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:11px 0;font-size:16px;outline:none}
.search .clr{border:0;background:none;width:34px;height:34px;color:var(--muted);font-size:20px;line-height:1}
.sres{margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.2);max-height:50vh;overflow-y:auto}
.sres button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 12px;font-size:15px}
.sres button:first-child{border-top:0}
.sres i{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.2)}
.sres small{color:var(--muted);margin-left:auto;font-size:12px;white-space:nowrap}
.knockrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 12px}
.knockrow span{flex:1;font-weight:600}
.knockrow button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.chip .kc{margin-left:auto;font-size:12px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 7px}
.backbox{border:2px solid #f59f00;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.backbox input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.rcpt{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.rcpt [data-seller][aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rcpt input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.cblist button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 12px}
.cblist button:first-child{border-top:0}
.cblist b{min-width:96px;font-variant-numeric:tabular-nums}
@media (max-width:460px){.brand .bw{display:none}}
.scout-sel{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 8px;font:600 13px/1 var(--body);max-width:130px}
.scout-sel option{color:#111}
.soldby{display:flex;align-items:center;gap:10px}
.soldby select{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.board{border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.board table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.board th,.board td{padding:9px 5px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.board th{border-top:0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.board td:first-child,.board th:first-child{text-align:left;font-weight:700}
.board tr.lead td{background:rgba(245,179,1,.14)}
.star-ic{background:none;border:0}
.star-ic div{font-size:20px;line-height:1;color:#f5b301;text-shadow:0 0 2px #000,0 0 1px #000,0 1px 3px rgba(0,0,0,.6)}
.big{margin:0;font-weight:700;color:#a87900;display:flex;gap:6px;align-items:center}
.big span{color:#f5b301;font-size:18px;text-shadow:0 0 1px #000}
@media (prefers-color-scheme:dark){.big{color:#f5c542}}
.unpaid{font:700 10px/1 var(--body);background:#e03131;color:#fff;border-radius:3px;padding:2px 4px;margin-top:2px;letter-spacing:.04em;text-transform:uppercase}
.pay-warn{color:#e03131;font-weight:700;font-size:13px}
.tchip.warn{background:#e03131;color:#fff}
.heatn{font:600 10px/1 var(--body);background:#111;color:#fff;border-radius:3px;padding:1px 3px;margin-top:2px}

/* tab bar */
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:500}
.tab{flex:1;border:0;background:none;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] svg{color:var(--accent)}

/* sheets */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:520;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.2);max-height:72%;display:flex;flex-direction:column}
.sheet.tall{max-height:88%}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 2px;flex:none}
.sh-head{display:flex;align-items:flex-start;gap:10px;padding:6px 16px 10px;flex:none}
.sh-title{flex:1;min-width:0}
.sh-title h2{margin:0;font:700 26px/1.05 var(--display);letter-spacing:.01em;text-wrap:balance}
.sh-title p{margin:3px 0 0;color:var(--muted);font-size:13px}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.sh-body{overflow-y:auto;padding:0 16px 18px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.label{font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 10px;font-weight:600;text-align:left;min-height:48px}
.chip i{width:18px;height:18px;border-radius:5px;flex:none;border:1px solid rgba(0,0,0,.15)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
.chip[aria-pressed="true"]::after{content:"";margin-left:auto;width:8px;height:14px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg) translateY(-2px)}
textarea,input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row > *{min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:#c92a2a}
.btn.small{padding:6px 10px;font-size:13px}
.hist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hist-row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-top:1px solid var(--line)}
.hist-row:first-child{border-top:0}
.hist-row .yr{font:700 17px/1.1 var(--display);width:56px;flex:none}
.hist-row .st{display:flex;align-items:center;gap:6px;font-weight:600}
.hist-row .st i{width:12px;height:12px;border-radius:3px}
.hist-row .nt{color:var(--muted);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}

/* seasons list */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);min-height:56px}
.li:first-child{border-top:0}
.li .nm{flex:1;min-width:0;font:700 19px/1.1 var(--display)}
.li .nm small{display:block;font:500 12px/1.3 var(--body);color:var(--muted)}
.tag{font:700 11px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);padding:4px 7px;border-radius:6px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{outline:3px solid var(--ink);outline-offset:2px}
.money{display:flex;gap:14px;font-size:13px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.85);flex-wrap:wrap}
.money b{color:#fff;font-weight:700}
.money .gt b{color:var(--accent)}
.money .unp b{color:#ff8787}
.money .kid{flex-basis:100%;background:rgba(245,179,1,.18);border:1px solid rgba(245,179,1,.45);border-radius:8px;padding:5px 8px;color:#fff}
.money .kid b{color:var(--accent)}
.amts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amt{display:flex;flex-direction:column;gap:6px;min-width:0}
.amt span{font-size:13px;font-weight:600;color:var(--muted)}
.amt .in{display:flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding-left:12px}
.amt .in b{color:var(--muted);font-weight:600}
.amt .in input{border:0;background:transparent;padding:10px 12px 10px 4px;width:100%;font-variant-numeric:tabular-nums}
.amt-total{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.li .money-line{display:block;font:500 12px/1.4 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.has{background:var(--bg)}
.it-name{flex:1;min-width:0;font-weight:600;line-height:1.2}
.it-name small{display:block;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;line-height:1}
.step input{width:46px;height:40px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;padding:0}
.order-sum{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;font-variant-numeric:tabular-nums;margin-top:10px}
.order-sum b{font-weight:700}
.legacy{font-size:13px;color:var(--muted);margin:8px 0 0}
.prod-row{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.prod-row:first-child{border-top:0}
.prod-row input.pl{flex:1}
.prod-row .pp{display:flex;align-items:center;gap:4px;width:96px;flex:none}
.prod-row .pp input{width:100%}
.paidbox{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pay{display:flex;gap:8px;flex-wrap:wrap}
.pay label{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;min-height:46px;cursor:pointer}
.pay input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.pay label:has(input:checked){border-color:var(--ink);background:var(--bg)}
.danger-row{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.heatbox{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.ramp{display:flex;height:14px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.ramp i{flex:1}
.ramp-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* status editor */
.st-row{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.st-row:first-child{border-top:0}
.st-row input[type=color]{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--surface);flex:none}
.st-row input[type=text]{flex:1}
.icon-btn{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;color:var(--muted);flex:none;border-radius:10px}
.icon-btn svg{width:20px;height:20px}

/* confirm */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;padding:18px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:14px}
.modal p{margin:0}
.modal .row{justify-content:flex-end}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-row">
      <div class="brand"><span class="bw">Scout </span>Door Map</div>
      <select class="scout-sel" id="scoutSel" aria-label="Which scout is selling right now"></select>
      <button class="season-pill" id="seasonPill" aria-label="Change season"></button>
    </div>
    <div class="tally" id="tally"></div>
    <div class="money" id="money" aria-live="polite"></div>
  </header>
  <div class="safe" id="safe" hidden role="status"></div>
  <div class="mapwrap">
    <div id="map" role="application" aria-label="Neighborhood map"></div>
    <div class="search" id="search">
      <div class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="searchIn" placeholder="Search an address" autocomplete="off" aria-label="Search an address" enterkeyhint="search">
        <button class="clr" id="searchClr" type="button" aria-label="Clear search" hidden>&times;</button></div>
      <div class="sres" id="searchRes" hidden></div>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="fabs">
      <button class="fab truck" id="fabDeliver" aria-label="Delivery mode" title="Delivery mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h13v10H1z"/><path d="M14 9h4l4 4v3h-8"/><circle cx="5.5" cy="17.5" r="2"/><circle cx="17.5" cy="17.5" r="2"/></svg>
      </button>
      <button class="fab" id="fabBase" aria-label="Switch map style" title="Map or satellite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg>
      </button>
      <button class="fab" id="fabAdd" aria-label="Add a missing house" title="Add a house">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M12 12v6M9 15h6"/></svg>
      </button>
      <button class="fab" id="fabLocate" aria-label="Show my location" title="My location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>
    <div class="toast" id="toast" hidden></div>
    <section class="sheet" id="sheet" hidden aria-modal="false"></section>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="map" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2V6Z"/><path d="M9 4v14M15 6v14"/></svg>Map
    </button>
    <button class="tab" role="tab" data-tab="seasons" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 12 10 5 10-5"/><path d="m2 16 10 5 10-5"/></svg>Seasons
    </button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Settings
    </button>
  </nav>
</div>
<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <div class="login-brand">Scout Door Map</div>
    <p class="login-sub">Sign in to see your map on any phone.</p>
    <label class="login-l" for="lgEmail">Email</label>
    <input type="email" id="lgEmail" autocomplete="username" inputmode="email" required>
    <label class="login-l" for="lgPass">Password</label>
    <input type="password" id="lgPass" autocomplete="current-password" required>
    <p class="login-err" id="lgErr" hidden></p>
    <button class="btn primary" type="submit" id="lgBtn">Sign in</button>
    <button class="login-skip" type="button" id="lgSkip">Use without signing in on this phone</button>
  </form>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
"use strict";
/* ---------- storage ---------- */
const KS='sdm.state.v1', KH='sdm.houses.v1', KT='sdm.tiles.v1';
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Phone storage is full. Export a backup in Settings, then clear saved map houses.');return false}}
const YR=new Date().getFullYear();
const DEFAULT_PRODUCTS=[
  {id:'w25',label:'Balsam Fir Wreath (25")',price:30},{id:'w36',label:'Balsam Fir Wreath (36")',price:50},{id:'wvoy',label:'Wreath Voyageur',price:40},
  {id:'swag',label:'Door Swag',price:30},{id:'garl',label:'Garland 25 ft',price:45},{id:'cent',label:'Centerpiece',price:40},
  {id:'spru',label:'Spruce Tops',price:40},{id:'porch',label:'Porch Pot Kit',price:25},{id:'cross',label:'Holiday Cross',price:40},{id:'cane',label:'Candy Cane',price:40}];
// names from the first version, updated to match the order form unless you renamed them yourself
const OLD_PRODUCT_LABELS={w25:['Wreath 25 in.'],w36:['Wreath 36 in.'],wvoy:['Premium Voyageur Wreath (25")'],swag:['Balsam Door Swag'],garl:['Balsam Garland (25 ft)'],cent:['Holiday Centerpiece']};
function defaults(){return{
  statuses:[
    {id:'yes',label:'Yes, bought',color:'#2f9e44'},
    {id:'no',label:'No',color:'#e03131'},
    {id:'nothome',label:'Not home',color:'#868e96'},
    {id:'comeback',label:'Come back',color:'#f59f00'},
    {id:'tooknum',label:'Took my number',color:'#1c7ed6'}
  ],
  seasons:[{id:'s'+YR,name:String(YR)}],
  active:'s'+YR, show:[], marks:{},
  heat:{on:false,status:'yes'},
  base:'street', view:{c:[44.9239,-92.9594],z:15}
}}
let S=Object.assign(defaults(),load(KS,{}));
let H=load(KH,{});
let T=new Set(load(KT,[]));
var SY={on:false,ready:false,db:null,auth:null,last:{},pushT:null,localOnly:false,user:null,online:navigator.onLine,unsent:{},err:null,okAt:0};
try{const u=JSON.parse(localStorage.getItem('sdm.unsent')||'{}');if(u&&typeof u==='object')SY.unsent=u}catch(e){}
function saveS(){const r=save(KS,S);schedulePush();return r}
const saveT=()=>save(KT,[...T]);
// each season keeps its own product list and prices
function prodsFor(sid){const se=S.seasons.find(x=>x.id===sid);if(!se)return DEFAULT_PRODUCTS;if(!se.products){const i=S.seasons.indexOf(se);const prev=S.seasons.slice(0,i).reverse().find(x=>x.products);se.products=JSON.parse(JSON.stringify(prev?prev.products:DEFAULT_PRODUCTS))}return se.products}
S.seasons.forEach(se=>prodsFor(se.id));
{let ch=false;for(const se of S.seasons)for(const p of (se.products||[])){if(OLD_PRODUCT_LABELS[p.id]&&OLD_PRODUCT_LABELS[p.id].includes(p.label)){p.label=DEFAULT_PRODUCTS.find(d=>d.id===p.id).label;ch=true}}if(ch)save(KS,S)}
function itemsTotal(sid,items){let t=0;if(!items)return 0;for(const p of prodsFor(sid))t+=(+items[p.id]||0)*p.price;return Math.round(t*100)/100}
function recomputeSales(sid){const m=S.marks[sid]||{};for(const k in m)if(m[k].items)m[k].sale=itemsTotal(sid,m[k].items)}
function saveH(){const out={};for(const id in H)if(!H[id].temp)out[id]=H[id];const r=save(KH,out);schedulePush();return r}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r6=x=>Math.round(x*1e6)/1e6;
const statusById=id=>S.statuses.find(s=>s.id===id);
const seasonById=id=>S.seasons.find(s=>s.id===id);
const mark=(sid,hid)=>(S.marks[sid]||{})[hid];
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const dark=()=>window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
function addrOf(h){if(!h)return'';return (h.n?h.n:'')+(h.s?(h.n?' ':'')+h.s:'')}
function confirmBox(text,ok){return new Promise(res=>{
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML='<div class="modal" role="dialog" aria-modal="true"><p>'+esc(text)+'</p><div class="row"><button class="btn" data-a="0">Cancel</button><button class="btn primary" data-a="1">'+esc(ok)+'</button></div></div>';
  bg.addEventListener('click',e=>{const a=e.target.getAttribute('data-a');if(a!==null||e.target===bg){bg.remove();res(a==='1')}});
  document.body.appendChild(bg);bg.querySelector('[data-a="1"]').focus();
})}
function shown(){ // seasons in play for combined views: active plus toggled
  const ids=new Set(S.show.filter(id=>seasonById(id)));ids.add(S.active);
  return S.seasons.filter(s=>ids.has(s.id)).map(s=>s.id);
}
function heatCount(key){let n=0;for(const sid of shown()){const m=mark(sid,key);if(m&&m.st===S.heat.status)n++}return n}
const hasUnits=h=>h&&h.u&&h.u.length>0;
function unitStats(hid){
  const h=H[hid],m=S.marks[S.active]||{},cnt={};let marked=0;
  for(const u of h.u){const mm=m[hid+'|'+u];if(mm&&mm.st){cnt[mm.st]=(cnt[mm.st]||0)+1;marked++}}
  let top=null,tv=0;for(const k in cnt)if(cnt[k]>tv){tv=cnt[k];top=k}
  return{marked,top,total:h.u.length};
}
function unitHeat(hid){const h=H[hid];let s=0;for(const u of h.u)s+=heatCount(hid+'|'+u);return s/(h.u.length*shown().length)}
function money(n){n=Math.round((+n||0)*100)/100;return'$'+n.toLocaleString('en-US',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}
function parseAmt(v){const n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isNaN(n)?0:Math.round(n*100)/100}
function seasonTotals(sid){let sale=0,don=0,unpaid=0;const m=S.marks[sid]||{};for(const k in m){const a=+m[k].sale||0,d=+m[k].don||0;sale+=a;don+=d;if(!m[k].paid)unpaid+=a+d}return{sale,don,total:sale+don,unpaid}}
// a door owes money when it bought or gave something but Paid is still off
function needsPay(key){const m=mark(S.active,key);return!!(m&&!m.paid&&(((+m.sale||0)+(+m.don||0))>0||m.st==='yes'))}
// gold star: sales or donation over $100 in any season
const BIG=100;
function bigBuyer(key){let best=null;for(const se of S.seasons){const m=(S.marks[se.id]||{})[key];if(!m)continue;const a=Math.max(+m.sale||0,+m.don||0);if(a>BIG&&(!best||a>best.amt))best={amt:a,season:se.name,kind:(+m.sale||0)>=(+m.don||0)?'sales':'donation'}}return best}
function houseBig(hid){const h=H[hid];if(!h||h.x)return null;if(hasUnits(h)){let best=null;for(const u of h.u){const b=bigBuyer(hid+'|'+u);if(b&&(!best||b.amt>best.amt))best=b}return best}return bigBuyer(hid)}
function houseNeedsPay(hid){const h=H[hid];if(!h||h.x)return false;if(hasUnits(h))return h.u.some(u=>needsPay(hid+'|'+u));return needsPay(hid)}
function exportBackup(){
  const blob=new Blob([JSON.stringify({app:'scout-door-map',v:1,exported:new Date().toISOString(),state:S,houses:H})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='door-map-backup-'+new Date().toISOString().slice(0,16).replace(':','')+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  S.lastExport=Date.now();S.dirty=0;saveS();renderSafe();toast('Backup saved to your Downloads folder');
}
function csvCell(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(sid){
  const se=seasonById(sid);const prods=prodsFor(sid);const m=S.marks[sid]||{};
  const qty={};prods.forEach(p=>qty[p.id]=0);let don=0,legacy=0;const orders=[];
  for(const k in m){const mm=m[k];const it=mm.items||{};let has=false;prods.forEach(p=>{const q=+it[p.id]||0;if(q){qty[p.id]+=q;has=true}});
    don+=+mm.don||0;if(!mm.items&&mm.sale){legacy+=+mm.sale;has=true}
    if(has||+mm.don)orders.push(k)}
  const rows=[];const money2=n=>(Math.round(n*100)/100).toFixed(2);
  rows.push([(se?se.name:'')+' order totals']);
  rows.push(['Item','Price','Quantity','Total']);
  let itemsSum=0;prods.forEach(p=>{const t=qty[p.id]*p.price;itemsSum+=t;rows.push([p.label,money2(p.price),qty[p.id],money2(t)])});
  if(legacy)rows.push(['Sales entered without items','','',money2(legacy)]);
  rows.push(['Items total','','',money2(itemsSum+legacy)]);
  rows.push(['Donations','','',money2(don)]);
  rows.push(['Grand total','','',money2(itemsSum+legacy+don)]);
  {let up=0;for(const k in m)if(!m[k].paid)up+=(m[k].items?itemsTotal(sid,m[k].items):(+m[k].sale||0))+(+m[k].don||0);rows.push(['Not paid yet (already included in grand total)','','',money2(up)])}
  rows.push([]);rows.push(['Orders by house']);
  rows.push(['Address','Unit'].concat(prods.map(p=>p.label)).concat(['Items $','Donation $','Total $','Paid','Paid by','Scout','Notes']));
  const addrFor=k=>{const [hid,unit]=k.split('|');const h=H[hid];return{a:h?(addrOf(h)||'No address'):'Removed house',u:unit||''}};
  orders.sort((x,y)=>{const a=addrFor(x),b=addrFor(y);return (a.a+' '+a.u).localeCompare(b.a+' '+b.u,undefined,{numeric:true})});
  for(const k of orders){const mm=m[k];const it=mm.items||{};const ad=addrFor(k);const sale=mm.items?itemsTotal(sid,it):(+mm.sale||0);
    const by=mm.pay?['cash','check','venmo'].filter(w=>mm.pay[w]).map(w=>w[0].toUpperCase()+w.slice(1)).join(' + '):'';
    rows.push([ad.a,ad.u].concat(prods.map(p=>+it[p.id]||'')).concat([money2(sale),money2(+mm.don||0),money2(sale+(+mm.don||0)),mm.paid?'Yes':'No',by,mm.seller||'',(mm.note||'').replace(/\s+/g,' ')]))}
  const csv=rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='orders-'+(se?se.name:'season').replace(/[^A-Za-z0-9]+/g,'-')+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  toast('Order spreadsheet saved to Downloads');
}
function dotColor(st){return st.dot||st.color} // dots match the box color until you pick a different one
function dotsHtml(key,others){let o='<span class="dots">';for(const sid of others){const m=mark(sid,key),st=m&&statusById(m.st);o+=st?'<i style="background:'+dotColor(st)+'"></i>':'<i class="empty"></i>'}return o+'</span>'}
// delivery mode helpers
const DEFAULT_CODES={w25:'W25',w36:'W36',wvoy:'VOY',swag:'SWG',garl:'GAR',cent:'CP',spru:'SPR',porch:'PPK',cross:'CRS',cane:'CC'};
function pcode(p){return (p.code||DEFAULT_CODES[p.id]||p.label.split(/\s+/).map(w=>w[0]||'').join('').slice(0,3)).toUpperCase()}
function orderOf(key){const m=mark(S.active,key);if(!m)return null;const items=[];
  if(m.items)for(const p of prodsFor(S.active)){const q=+m.items[p.id]||0;if(q)items.push({p,q})}
  const legacy=!m.items&&+m.sale?+m.sale:0;if(!items.length&&!legacy)return null;
  return{items,legacy,m,due:m.paid?0:(m.items?itemsTotal(S.active,m.items):(+m.sale||0))+(+m.don||0)}}
function houseOrders(hid){const h=H[hid];if(!h||h.x)return[];if(hasUnits(h)){const sh=unitShort(h);return h.u.map((u,i)=>({u,short:sh[i],key:hid+'|'+u,o:orderOf(hid+'|'+u)})).filter(x=>x.o)}
  const o=orderOf(hid);return o?[{u:null,key:hid,o}]:[]}
function delStyle(list,sel){
  if(!list.length)return{color:cssv('--outline'),weight:sel?3.5:1,opacity:.35,fillColor:cssv('--box'),fillOpacity:.06};
  if(list.every(x=>x.o.m.delivered))return{color:sel?cssv('--accent'):'#868e96',weight:sel?3.5:1.5,opacity:.9,fillColor:'#adb5bd',fillOpacity:.45};
  return{color:sel?cssv('--accent'):'#b35c00',weight:sel?3.5:2.5,opacity:1,fillColor:'#ffb300',fillOpacity:.9};
}
// come back times and receipts
function fmtBack(v){if(!v)return'';const d=new Date(v);if(isNaN(d))return'';return d.toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})}
const DEFAULT_SELLERS=['Ryler','Zander','Trexton','Amethyst'];
const sellers=()=>(S.sellers&&S.sellers.length?S.sellers:DEFAULT_SELLERS);
function listJoin(a){return a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' and '+a[a.length-1]}
const DEFAULT_DELIVERY_NOTE="We will deliver your selections the week before Thanksgiving. Please be aware that if you are not home we will place your selection on your porch or doorstep.\n\nIf you would prefer for us to drop off your selection while you are at home, please reply to this message.";
function receiptText(key,hid,unit,seller){const m=mark(S.active,key)||{};
  const lines=[];let t=0;
  if(m.items)for(const p of prodsFor(S.active)){const q=+m.items[p.id]||0;if(q){t+=q*p.price;lines.push(q+' x '+p.label+'  '+money(q*p.price))}}
  else if(+m.sale){t+=+m.sale;lines.push('Order  '+money(m.sale))}
  const don=+m.don||0;t+=don;
  const pack=S.packName||'Cub Scout Pack 601 of Woodbury';
  const by=m.pay?listJoin(['cash','check','venmo'].filter(w=>m.pay[w]).map(w=>w==='venmo'?'Venmo':w)):'';
  const out=['Hi, this is your Cub Scout'+(seller?' '+seller:'')+'!',''];
  if(lines.length){out.push('You have purchased the following in support of '+pack+':');lines.forEach(l=>out.push(l));if(don)out.push('Donation  '+money(don))}
  else out.push('You have donated '+money(don)+' in support of '+pack+'.');
  out.push('');
  out.push('Your total is '+money(t)+(m.paid?' and you paid in full'+(by?' by '+by:'')+'.':', which has not been paid yet.'));
  if(lines.length){out.push('');out.push((S.rcDelivery||DEFAULT_DELIVERY_NOTE).replace(/\r/g,''))}
  out.push('');out.push('Thank you for supporting us today!');
  return out.join('\n')}
function copyText(t){const ok=()=>toast('Receipt copied');
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,()=>fallback());else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){toast('Could not copy on this phone')}ta.remove()}}
function pastPhone(key){const order=S.seasons.slice().reverse();for(const se of order){if(se.id===S.active)continue;const m=(S.marks[se.id]||{})[key];if(m&&m.phone)return{phone:m.phone,season:se.name}}return null}
function knockText(n){return 'Knocked '+n+' time'+(n===1?'':'s')+', nobody home'}
function heatOn(){return S.heat.on && shown().length>1 && statusById(S.heat.status)}

/* ---------- map ---------- */

// darken toward deeper shade as f grows (f 0..1)
function shadeColor(hex,f){

}

    const tr=([x,y])=>[h.c[0]+(x*si+y*co)/ky,h.c[1]+(x*co-y*si)/kx];const out0=[];

/* ---------- loading house footprints from OpenStreetMap ---------- */
const EPS=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
const TZ=16;
const lon2x=(lon,z)=>Math.floor((lon+180)/360*Math.pow(2,z));
const lat2y=(lat,z)=>Math.floor((1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*Math.pow(2,z));
const x2lon=(x,z)=>x/Math.pow(2,z)*360-180;
const y2lat=(y,z)=>{const n=Math.PI-2*Math.PI*y/Math.pow(2,z);return 180/Math.PI*Math.atan(.5*(Math.exp(n)-Math.exp(-n)))};
const queue=[]; const inflight=new Set(); const failed=new Map(); let pumping=false;
const AUTO_OUTLINES=false; // boxes are placed by tapping; no background downloads
function wantTiles(){
  if(!AUTO_OUTLINES)return;
  if(map.getZoom()<16){setBanner(map.getZoom()>=13&&!Object.keys(H).length?'Zoom in on your street to load the houses.':null);return}
  const b=map.getBounds();
  const x0=lon2x(b.getWest(),TZ),x1=lon2x(b.getEast(),TZ),y0=lat2y(b.getNorth(),TZ),y1=lat2y(b.getSouth(),TZ);
  if((x1-x0+1)*(y1-y0+1)>12)return;
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){
    const k=x+'/'+y; if(T.has(k)||inflight.has(k)||queue.includes(k))continue;
    const f=failed.get(k); if(f&&Date.now()-f<20000)continue;
    queue.push(k);
  }
  pump();
}
async function pump(){
  if(pumping)return; pumping=true;let anyFail=false;
  while(queue.length){
    const k=queue.shift(); inflight.add(k);
    setBanner('Loading house outlines. You can tap any house to mark it now.',true);
    try{await loadTile(k);T.add(k);saveT();failed.delete(k)}
    catch(e){anyFail=true;failed.set(k,Date.now());setBanner('House outlines did not load here. Tap any house to mark it anyway, or move the map to try again.');inflight.delete(k);await sleep(2500);continue}
    inflight.delete(k);
  }
  pumping=false; if(anyFail)setTimeout(()=>{if(!pumping)setBanner(null)},7000);else setBanner(null); drawHouses(); drawLabels();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let banT;
function setBanner(text,spin){const b=$('#banner');clearTimeout(banT);if(!text){b.hidden=true;b.innerHTML='';return}b.innerHTML=(spin?'<span class="spin" aria-hidden="true"></span>':'')+'<span>'+esc(text)+'</span>';b.hidden=false}
async function fetchT(url,opts,ms){
  const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms);
  try{return await fetch(url,Object.assign({},opts,{signal:ac.signal}))}finally{clearTimeout(t)}
}
let epStart=0; // remember which server answered last
async function overpass(q){
  let last;
  for(let i=0;i<EPS.length;i++){
    const idx=(epStart+i)%EPS.length;
    try{const r=await fetchT(EPS[idx],{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)},18000);
      if(r.ok){const j=await r.json();epStart=idx;return j} last=new Error('HTTP '+r.status)}catch(e){last=e}
  }
  throw last||new Error('failed');
}
// street address for a spot the user tapped: Esri address points first (house-level in Woodbury), then OpenStreetMap, then the nearest box's street
async function lookupEsri(c){
  const r=await fetchT('https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/reverseGeocode?f=json&featureTypes=PointAddress&location='+c[1]+','+c[0],{},7000);
  if(!r.ok)return null;const j=await r.json();const a=j&&j.address;if(!a||!a.AddNum)return null;
  if(j.location&&distM(c,[j.location.y,j.location.x])>90)return null; // too far away to be this house
  const st=(a.Address||'').startsWith(a.AddNum)?a.Address.slice(a.AddNum.length).trim():(a.Address||'');
  return{n:String(a.AddNum),s:st};
}
async function lookupOSM(c){
  const r=await fetchT('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat='+c[0]+'&lon='+c[1],{headers:{'Accept':'application/json'}},7000);
  if(!r.ok)return null;const j=await r.json();const a=j&&j.address||{};

}
function nearbyStreet(c){let best=null,bd=80;for(const id in H){const h=H[id];if(!h.s||h.temp||h.x)continue;const d=distM(c,h.c);if(d<bd){bd=d;best=h.s}}return best?{n:'',s:best}:null}
async function lookupAddress(c){

const SKIP=new Set(['garage','garages','shed','carport','roof','commercial','retail','industrial','warehouse','school','church','office','hospital','service','construction','greenhouse','barn','farm_auxiliary','hut','kiosk','transformer_tower','public','civic','government','supermarket','hotel','university','college','sports_hall','parking','stadium','fire_station','water_tower','toilets','boathouse','gazebo','pavilion','chapel','mosque','temple','synagogue','kindergarten','train_station','bunker','storage_tank','silo','ruins']);
function areaM2(p){const lat0=p[0][0]*Math.PI/180,mx=111320*Math.cos(lat0),my=110540;let a=0;for(let i=0,j=p.length-1;i<p.length;j=i++){a+=(p[j][1]*mx)*(p[i][0]*my)-(p[i][1]*mx)*(p[j][0]*my)}return Math.abs(a/2)}
function centroid(p){let la=0,lo=0;for(const q of p){la+=q[0];lo+=q[1]}return[r6(la/p.length),r6(lo/p.length)]}
function pip(pt,p){let ins=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const yi=p[i][0],xi=p[i][1],yj=p[j][0],xj=p[j][1];if(((yi>pt[0])!==(yj>pt[0]))&&(pt[1]<(xj-xi)*(pt[0]-yi)/(yj-yi)+xi))ins=!ins}return ins}
function distM(a,b){const dx=(a[1]-b[1])*111320*Math.cos(a[0]*Math.PI/180),dy=(a[0]-b[0])*110540;return Math.sqrt(dx*dx+dy*dy)}
// boxes you place: a rectangle around the tap point, turned by h.rot degrees
function boxCorners(c,hw,hh,deg){const r=(deg||0)*Math.PI/180,co=Math.cos(r),si=Math.sin(r),kx=111320*Math.cos(c[0]*Math.PI/180),ky=110540;

async function loadTile(k){

  const bb=[s,w,n,e].map(v=>v.toFixed(6)).join(',');

  for(const nd of nodes){
    for(const b of bld){
      if(nd.c[0]<b.bx[0]||nd.c[0]>b.bx[2]||nd.c[1]<b.bx[1]||nd.c[1]>b.bx[3])continue;
      if(pip(nd.c,b.p)){nd.inside=b.id;b.ins.push(nd);break}
    }
  }
  for(const b of bld){
    const nums=[...new Set(b.ins.map(x=>x.n))];
    if(nums.length>=2){b.multi=true}            // townhome row: one box per address inside
    else if(nums.length===1&&!b.n){b.n=nums[0];b.s=b.s||b.ins[0].s}
    b.ins.forEach(x=>used.add(x.id));
  }
  // nearest free address point within 30 m
  for(const b of bld){
    if(b.n||b.multi)continue;let best=null,bd=30;
    for(const nd of nodes){if(used.has(nd.id)||nd.inside)continue;const d=distM(b.c,nd.c);if(d<bd){bd=d;best=nd}}
    if(best){b.n=best.n;b.s=b.s||best.s;used.add(best.id)}
  }
  for(const b of bld){
    if(b.multi){
      if(!(H[b.id]&&H[b.id].e))H[b.id]={c:b.c,p:b.p,n:'',s:b.s||b.ins[0].s,multi:1};
      for(const nd of b.ins){if(H[nd.id]&&H[nd.id].e)continue;const c=[r6(nd.c[0]),r6(nd.c[1])];H[nd.id]={c,p:square(c,3),n:nd.n,s:nd.s,parent:b.id}}
      continue;
    }
    if(H[b.id]&&H[b.id].e)continue;
    H[b.id]={c:b.c,p:b.p,n:b.n,s:b.s};
  }
  // address points with no footprint get a small box
  for(const nd of nodes){
    if(used.has(nd.id)||nd.inside)continue;
    if(H[nd.id]&&H[nd.id].e)continue;
    const c=[r6(nd.c[0]),r6(nd.c[1])];
    H[nd.id]={c,p:square(c,6),n:nd.n,s:nd.s};
  }
  saveH();
  drawHouses();
}

function moveTo(hid,ll){const h=H[hid];if(!h)return;const dl=ll.lat-h.c[0],dg=ll.lng-h.c[1];h.c=[r6(ll.lat),r6(ll.lng)];
  if(h.custom)setBoxGeom(h);else h.p=h.p.map(q=>[r6(q[0]+dl),r6(q[1]+dg)]);
  if(polys[hid])polys[hid].setLatLngs(h.p);buildSlices(hid);if(halos[hid])halos[hid].setLatLng(h.c);if(stars[hid])stars[hid].setLatLng(h.c)}

    keepHouse(hid);H[hid].n=n;H[hid].s=st;H[hid].e=1;saveH();drawLabels();const t=sheet.querySelector('.sh-title h2');if(t&&!t.dataset.unit)t.textContent=addrOf(H[hid])||'House with no number';if(!quiet)toast('Address saved')};

  ['#numIn','#strIn'].forEach(sel=>{const i=q(sel);if(!i)return;i.addEventListener('change',()=>saveAddr(true));i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveAddr(false);i.blur()}})});
  const uf=q('#uFill');if(uf)uf.addEventListener('click',()=>{
    const fv=q('#uFrom').value.trim(),tv=q('#uTo').value.trim();const add=[];
    const lf=fv.match(/^(.*?)([A-Za-z])$/);let lt=tv.match(/^(.*?)([A-Za-z])$/);

function setMark(key,hid,patch){
  keepHouse(hid);
  if(!S.marks[S.active])S.marks[S.active]={};
  const v=Object.assign({st:null,note:'',paid:false,pay:{},sale:0,don:0},S.marks[S.active][key],patch,{t:Date.now()});
  if(!v.seller&&S.lastSeller&&('st' in patch||'items' in patch||'don' in patch))v.seller=S.lastSeller;
  if(!v.st&&!v.note&&!v.paid&&!v.sale&&!v.don)delete S.marks[S.active][key];else S.marks[S.active][key]=v;
  if(!patch.note)S.dirty=(S.dirty||0)+1; // typing a note counts once per save, not per letter
  saveS();restyle(hid);renderTally();if(map.getZoom()>=18)drawLabels();renderSafe();
  const w=sheet.querySelector('#payWarn');if(w)w.hidden=!needsPay(key);
  const bl=sheet.querySelector('#bigLine');if(bl){const b=bigBuyer(key);bl.hidden=!b;if(b)bl.innerHTML='<span>\u2605</span>Big buyer: '+money(b.amt)+' '+b.kind+' in '+esc(b.season)}
}

const NB=16; // data is spread over a few documents so each phone loads in a handful of reads

  for(const lk in SY.last){if(lk==='C'||seen.has(lk))continue;

     .catch(err=>{console.warn(err);for(const lk of ks)if(SY.unsent[lk]===stamp)SY.last[lk]='\u0000';SY.err=(err&&err.code)||'unknown';syncError(err);renderSafe()})};
  const TS=firebase.firestore.FieldValue.serverTimestamp();

      {method:'POST',signal:ctl.signal,headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},
       body:JSON.stringify({structuredQuery:{from:[{collectionId:'data'}],where:{fieldFilter:{field:{fieldPath:'u'},op:'GREATER_THAN',value:{timestampValue:since}}}}})});
    if(!r.ok)throw new Error('check '+r.status);
    const rows=await r.json();let newest=0;
    if(SY.okAt>=started-1000){checking=false;clearTimeout(to);return} // this phone saved while we were asking: answer may be stale, ask again next round
    for(const row of rows){
      if(row.readTime){const t=Date.parse(row.readTime);if(t>newest)newest=t}
      const d=row.document;if(!d)continue;
      const id=d.name.slice(d.name.lastIndexOf('/')+1),f=d.fields||{};
      const data={};

function syncError(err){if(err&&err.code==='permission-denied')toast('Your account is not allowed to save here. Check the email you signed in with.')}
function rerenderAll(){
  for(const id in polys){removeHalo(id);houseLayer.removeLayer(polys[id]);delete polys[id]}
  for(const k in slices)removeSlices(k);
  drawHouses();renderTop();restyleAll();renderSafe();
}
function applyConfig(c){try{const o=JSON.parse(c);if(o.statuses&&o.statuses.length)S.statuses=o.statuses;if(o.seasons&&o.seasons.length)S.seasons=o.seasons}catch(e){}
  if(!S.seasons.some(x=>x.id===S.active))S.active=S.seasons[S.seasons.length-1].id;S.show=S.show.filter(id=>S.seasons.some(x=>x.id===id));S.seasons.forEach(se=>prodsFor(se.id))}
// apply what the other phone changed; skip anything this phone changed and has not sent yet
function applyRemoteDoc(id,data){
  const changedH=new Set();let marksChanged=false,cfgChanged=false;
  if(id==='config'){if(data&&data.c&&data.c!==SY.last.C&&sharedConfig()===SY.last.C){applyConfig(data.c);SY.last.C=sharedConfig();cfgChanged=true}return{changedH,marksChanged,cfgChanged}}
  const m=(data&&data.m)||{};
  if(id[0]==='h'){
    const b=+id.slice(1);
    for(const hid in m){const lk='H:'+hid,j=m[hid];if(lk in SY.unsent)continue;const local=H[hid]&&!H[hid].temp?JSON.stringify(H[hid]):undefined;if(j===local){SY.last[lk]=j;continue}
      try{H[hid]=JSON.parse(j);SY.last[lk]=j;changedH.add(hid)}catch(e){}}
    for(const lk in SY.last){if(!lk.startsWith('H:'))continue;const hid=lk.slice(2);if(bucket(hid)!==b||hid in m)continue;
      if(!(lk in SY.unsent)){if(H[hid])changedH.add(hid);delete H[hid];delete SY.last[lk]}}
  }else if(id.startsWith('m_')){
    const r=id.slice(2),i=r.lastIndexOf('_'),sid=r.slice(0,i),b=+r.slice(i+1);
    if(!S.marks[sid])S.marks[sid]={};const sm=S.marks[sid];
    for(const k in m){const lk='M:'+sid+':'+k,j=m[k];if(lk in SY.unsent)continue;const local=sm[k]?JSON.stringify(sm[k]):undefined;if(j===local){SY.last[lk]=j;continue}
      try{sm[k]=JSON.parse(j);SY.last[lk]=j;marksChanged=true;changedH.add(k.split('|')[0])}catch(e){}}
    const pre='M:'+sid+':';
    for(const lk in SY.last){if(!lk.startsWith(pre))continue;const k=lk.slice(pre.length);if(bucket(k)!==b||k in m)continue;
      if(!(lk in SY.unsent)){if(sm[k]){marksChanged=true;changedH.add(k.split('|')[0])}delete sm[k];delete SY.last[lk]}}
  }
  return{changedH,marksChanged,cfgChanged};
}
let remoteT=null;const remotePending=new Set();let remoteCfg=false;
function queueRemoteRender(res){res.changedH.forEach(h=>remotePending.add(h));if(res.cfgChanged)remoteCfg=true;
  clearTimeout(remoteT);remoteT=setTimeout(()=>{
    save(KS,S);const out={};for(const id in H)if(!H[id].temp)out[id]=H[id];save(KH,out);
    if(remoteCfg){remoteCfg=false;remotePending.clear();rerenderAll();return}
    for(const hid of remotePending){if(H[hid]){if(polys[hid])redrawHouse(hid);else drawHouses()}else{removeHalo(hid);if(polys[hid]){houseLayer.removeLayer(polys[hid]);delete polys[hid]}}}
    remotePending.clear();renderTally();drawLabels();
  },150);
}
async function startSync(user){
  SY.user=user;SY.ready=false;
  setBanner('Loading your map...',true);
  let snap;
  try{snap=await SY.db.collection('data').get()}
  catch(err){setBanner(null);toast(err&&err.code==='permission-denied'?'This account cannot open the map. Check the email you signed in with.':'Could not reach your account. Working on this phone for now.');return}
  const rH={},rM={};let rC=null;
  snap.forEach(d=>{const id=d.id,data=d.data();
    if(id==='config'){rC=data.c||null;return}
    const m=data.m||{};
    if(id[0]==='h'){for(const k in m)rH[k]=m[k]}
    else if(id.startsWith('m_')){const r=id.slice(2),sid=r.slice(0,r.lastIndexOf('_'));(rM[sid]=rM[sid]||{});for(const k in m)rM[sid][k]=m[k]}});
  const firstOnThisPhone=load('sdm.synced',null)!==FB_CONFIG.projectId+':'+user.uid;
  const last={};
  // houses: the account's copy wins; on a phone's first sign in, its extra houses are added
  const newH={};for(const k in rH){try{newH[k]=JSON.parse(rH[k]);last['H:'+k]=rH[k]}catch(e){}}
  if(firstOnThisPhone)for(const k in H)if(!(k in newH)&&!H[k].temp)newH[k]=H[k];
  const newM={};for(const sid in rM){newM[sid]={};for(const k in rM[sid]){try{newM[sid][k]=JSON.parse(rM[sid][k]);last['M:'+sid+':'+k]=rM[sid][k]}catch(e){}}}
  if(firstOnThisPhone)for(const sid in S.marks){newM[sid]=newM[sid]||{};for(const k in S.marks[sid])if(!(k in newM[sid]))newM[sid][k]=S.marks[sid][k]}
  if(rC){const localSeasons=S.seasons,localStatuses=S.statuses;applyConfig(rC);last.C=rC;
    if(firstOnThisPhone){for(const se of localSeasons)if(!S.seasons.some(x=>x.id===se.id))S.seasons.push(se);for(const st of localStatuses)if(!S.statuses.some(x=>x.id===st.id))S.statuses.push(st)}}
  // anything this phone changed that never reached the account: this phone's copy wins and is sent again
  for(const lk in SY.unsent){
    if(lk.startsWith('H:')){const hid=lk.slice(2);if(H[hid]&&!H[hid].temp)newH[hid]=H[hid];else delete newH[hid]}
    else if(lk.startsWith('M:')){const r=lk.slice(2),i=r.indexOf(':'),sid=r.slice(0,i),k=r.slice(i+1);const lm=S.marks[sid]&&S.marks[sid][k];
      if(lm){(newM[sid]=newM[sid]||{})[k]=lm}else if(newM[sid])delete newM[sid][k]}
    if(lk in last)last[lk]='\u0000'}
  H=newH;S.marks=newM;
  SY.last=last;SY.ready=true;SY.on=true;SY.since=Date.now();
  save('sdm.synced',FB_CONFIG.projectId+':'+user.uid);
  save(KS,S);{const out={};for(const id in H)if(!H[id].temp)out[id]=H[id];save(KH,out)}
  SY.unsent={};saveUnsent();
  pushChanges(); // sends anything this phone had that the account did not (this re-marks those keys as unsent until confirmed)
  setBanner(null);rerenderAll();
  if(SY.unsub)SY.unsub();
  SY.listenDead=false;
  SY.unsub=SY.db.collection('data').onSnapshot({includeMetadataChanges:false},qs=>{
    if(SY.pushT){clearTimeout(SY.pushT);SY.pushT=null;pushChanges()}SY.heardAt=Date.now();
    qs.docChanges().forEach(ch=>{const res=applyRemoteDoc(ch.doc.id,ch.type==='removed'?{}:ch.doc.data());if(res.changedH.size||res.cfgChanged||res.marksChanged)queueRemoteRender(res)})
  },err=>{console.warn(err);syncError(err);SY.listenDead=true});
  toast(firstOnThisPhone&&Object.keys(rH).length===0?'Your map is now saved to your account':'Signed in. Your map is up to date.');
}
function showLogin(show){$('#login').hidden=!show}
const SYNC_ENABLED=true;
const FB_SDK=['app','auth','firestore'].map(n=>'https://www.gstatic.com/firebasejs/10.14.1/firebase-'+n+'-compat.js');
function loadScript(src){return new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=rej;document.head.appendChild(el)})}
async function initSync(){
  $('#login').hidden=true;
  // sign in only runs on the real website; a downloaded copy keeps working on this phone alone
  if(!SYNC_ENABLED||!isWebsite){SY.localOnly=true;return}
  try{for(const src of FB_SDK)await loadScript(src)}catch(e){SY.localOnly=true;renderSafe();return} // no signal: keep working on this phone
  if(typeof firebase==='undefined'||!firebase.initializeApp){SY.localOnly=true;renderSafe();return} // no signal on first open: work on this phone
  try{firebase.initializeApp(FB_CONFIG)}catch(e){}
  SY.auth=firebase.auth();SY.db=firebase.firestore();
  try{SY.db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  SY.auth.onAuthStateChanged(user=>{
    if(user){showLogin(false);startSync(user)}
    else{SY.on=false;SY.ready=false;if(SY.unsub){SY.unsub();SY.unsub=null}if(!load('sdm.localOnly',false))showLogin(true);renderSafe()}
  });
  $('#loginForm').addEventListener('submit',async e=>{e.preventDefault();
    const em=$('#lgEmail').value.trim(),pw=$('#lgPass').value,er=$('#lgErr');er.hidden=true;
    if(!em||!pw){er.textContent='Enter your email and password.';er.hidden=false;return}
    $('#lgBtn').disabled=true;$('#lgBtn').textContent='Signing in...';
    try{await SY.auth.signInWithEmailAndPassword(em,pw);save('sdm.localOnly',false)}
    catch(err){const c=err&&err.code||'';er.textContent=c.includes('network')?'Could not reach your account. Check your signal, or open the app from its web address instead of a downloaded file.':(c.includes('too-many')?'Too many tries. Wait a few minutes and try again.':(/wrong-password|user-not-found|invalid-credential|invalid-login|invalid-email/.test(c)?'That email and password do not match.':'Sign in failed ('+(c||(err&&err.message)||'unknown')+'). Send this message to Claude.'));er.hidden=false}
    $('#lgBtn').disabled=false;$('#lgBtn').textContent='Sign in';
  });
  $('#lgSkip').addEventListener('click',()=>{save('sdm.localOnly',true);showLogin(false);toast('Working on this phone only. Sign in anytime from Settings.')});
}
window.addEventListener('online',()=>{SY.online=true;renderSafe();if(SY.user&&!SY.ready)startSync(SY.user)});
window.addEventListener('offline',()=>{SY.online=false;renderSafe()});

/* boot */
for(const id in H)if(H[id].temp)delete H[id];
{let ch=false;for(const id in H){const h=H[id];if(h.custom&&hasUnits(h)&&h.u.length>1&&!h.wd){setBoxGeom(h);h.wd=1;ch=true}}if(ch)saveH()} // widen unit boxes placed before sections existed
renderTop();drawHouses();drawLabels();wantTiles();renderSafe();initSync();
if(isWebsite&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(!Object.keys(H).length){setBanner('Zoom in on your street and tap a house to mark it.');setTimeout(()=>setBanner(null),6000)}
})();
</script>
