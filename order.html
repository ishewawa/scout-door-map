<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>It's Wreath Season!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f6f3ec;--surface:#fff;--ink:#1f2a24;--muted:#5f6b63;--line:#e2ddd2;--green:#1f6f43;--green2:#2f9e44;--red:#b3261e;--gold:#e2a400;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
.hero{background:radial-gradient(120% 90% at 50% 0%,#2a8a55 0%,#1f6f43 45%,#164f30 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 26px) 22px 34px;text-align:center;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;border:16px solid rgba(255,255,255,.07);top:-60px;left:-50px}
.hero:after{left:auto;right:-60px;top:auto;bottom:-90px;border-color:rgba(226,164,0,.18)}
.wreath{font-size:46px;line-height:1;margin-bottom:6px}
.hero h1{font-family:var(--display);font-size:40px;line-height:1;margin:0 0 8px;letter-spacing:.3px}
.hero p{margin:4px auto 0;max-width:420px;font-size:16.5px;line-height:1.4;color:#e6f2ea}
.hero b{color:#fff}
main{max-width:560px;margin:0 auto;padding:18px 16px 140px}
h2{font-family:var(--display);font-size:24px;margin:22px 4px 10px}
.what{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.what button{display:flex;align-items:center;gap:10px;border:2px solid transparent;background:var(--surface);border-radius:16px;min-height:62px;padding:12px 14px;font:700 17px var(--body);color:var(--ink);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);text-align:left}
.what i{width:16px;height:16px;border-radius:50%;flex:none}
.what button[aria-pressed="true"]{border-color:var(--ink)}
.what button[aria-pressed="true"]:after{content:"";margin-left:auto;width:7px;height:13px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg) translateY(-2px)}
.sec{display:none}.sec.on{display:block}
.items{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.items .prod{border-radius:0;margin:0;box-shadow:none;border-top:1px solid var(--line)}.items .prod:first-child{border-top:0}
.dollar{position:relative}.dollar span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted)}.dollar input{padding-left:28px;font-size:18px}
.prod{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px 12px 12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.prod .ic{width:44px;height:44px;border-radius:12px;background:#eaf4ee;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.prod .nm{flex:1;min-width:0}.prod .nm b{display:block;font-size:15.5px}.prod .nm span{color:var(--muted);font-size:14px}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:38px;height:38px;border-radius:50%;border:0;background:#eef0ec;color:var(--ink);font:700 22px/1 var(--body);cursor:pointer}
.step button.plus{background:var(--green);color:#fff}
.step output{min-width:22px;text-align:center;font:700 18px var(--body)}
.prod.on{box-shadow:0 0 0 2px var(--green) inset}
.dons{display:flex;flex-wrap:wrap;gap:8px}
.dons button{border:0;background:var(--surface);border-radius:999px;padding:11px 16px;font:700 15px var(--body);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer}
.dons button[aria-pressed="true"]{background:var(--green);color:#fff}
.other{display:none;margin-top:10px}.other.on{display:block}
label.f{display:block;margin:0 0 10px}
label.f span{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin:0 2px 5px}
input,textarea{width:100%;font:16px var(--body);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--green)}
.row2{display:flex;gap:10px}.row2>*{flex:1}.row2 .sm{flex:0 0 32%}
.pay{display:flex;flex-direction:column;gap:8px}
.pay label{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:13px 14px;cursor:pointer;border:2px solid transparent}
.pay label:has(input:checked){border-color:var(--green)}
.pay input{width:20px;height:20px;accent-color:var(--green);flex:none}
.pay b{display:block}.pay small{color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .tot{flex:1}.bar .tot span{display:block;font-size:12.5px;color:var(--muted)}.bar .tot b{font-family:var(--display);font-size:28px}
.go{border:0;background:var(--green);color:#fff;font:700 17px var(--body);padding:15px 22px;border-radius:14px;cursor:pointer}
.go:disabled{opacity:.45}
.err{color:var(--red);font-weight:600;font-size:14px;margin:8px 4px 0;min-height:1em}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.done{text-align:center;padding:26px 6px}
.done h2{font-size:32px;margin:6px 0}
.done p{color:var(--muted);line-height:1.5;font-size:16px}
.vbtn{display:inline-block;margin:14px 0 6px;background:#008cff;color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:15px 24px;border-radius:14px}
.sum{background:var(--surface);border-radius:16px;padding:14px 16px;text-align:left;margin:16px 0;line-height:1.6;font-size:15px}
.msg{background:var(--surface);border-radius:16px;padding:18px;text-align:center;line-height:1.5;color:var(--muted);margin-top:24px}
.foot{text-align:center;color:var(--muted);font-size:13.5px;margin-top:22px;line-height:1.5}
</style>
</head>
<body>
<div class="hero">
  <div class="wreath">🎄</div>
  <h1>It's Wreath Season!</h1>
  <p id="sub">Sorry we missed you!</p>
  <p id="sub2"></p>
</div>
<main id="main"><div class="msg">Loading...</div></main>
<script>
(function(){
const API='https://firestore.googleapis.com/v1/projects/cub-scouts-sales/databases/(default)/documents';
const KEY='AIzaSyDcR5UXs7nsVdIX7o4CBinruNualDsEre8';
const qs=new URLSearchParams(location.search);
const SHOP=(qs.get('f')||'main').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,40)||'main';
const SELLER=(qs.get('s')||'').slice(0,40);
const main=document.getElementById('main');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Math.round(n*100)/100).toFixed(2).replace(/\.00$/,'');
const ICON={w25:'🎄',w36:'🎄',wvoy:'🎄',swag:'🌿',garl:'🌲',cent:'🕯️',spru:'🌲',porch:'🪴',cross:'✝️',cane:'🍬'};

// Firestore REST <-> plain values
function fromFs(v){if(!v)return null;if('stringValue' in v)return v.stringValue;if('integerValue' in v)return +v.integerValue;if('doubleValue' in v)return v.doubleValue;if('booleanValue' in v)return v.booleanValue;
  if('nullValue' in v)return null;if('arrayValue' in v)return (v.arrayValue.values||[]).map(fromFs);if('mapValue' in v){const o={},f=v.mapValue.fields||{};for(const k in f)o[k]=fromFs(f[k]);return o}return null}
function toFs(x){if(x===null||x===undefined)return{nullValue:null};if(typeof x==='string')return{stringValue:x};if(typeof x==='boolean')return{booleanValue:x};
  if(typeof x==='number')return Number.isInteger(x)?{integerValue:String(x)}:{doubleValue:x};if(Array.isArray(x))return{arrayValue:{values:x.map(toFs)}};
  const f={};for(const k in x)f[k]=toFs(x[k]);return{mapValue:{fields:f}}}

let shop=null;const qty={};let don=0;
fetch(API+'/shop/'+SHOP+'?key='+KEY).then(r=>{if(!r.ok)throw r.status;return r.json()}).then(d=>{const f=d.fields||{};shop={};for(const k in f)shop[k]=fromFs(f[k]);render()})
  .catch(()=>{main.innerHTML='<div class="msg">This order page isn\'t set up yet. Please try again later.</div>'});

function render(){
  const seller=SELLER&&(shop.sellers||[]).includes(SELLER)?SELLER:'';
  document.getElementById('sub2').innerHTML=seller?'Help support <b>'+esc(seller)+'</b> in '+esc(shop.group||'Cub Scouts')+' this year by ordering or donating. We appreciate you!':'Help support our '+esc(shop.group||'Cub Scouts')+' this year by ordering or donating. We appreciate you!';
  document.title='Support '+(seller||shop.group||'our scouts')+' · Wreath Season';
  if(!shop.open){main.innerHTML='<div class="msg">Orders are closed for this season. Thank you for your support!'+(shop.phone?'<br><br>Questions? Call or text '+esc(shop.who||'us')+' at <b>'+esc(shop.phone)+'</b>':'')+'</div>';return}
  const prods=(shop.products||[]).filter(p=>p&&p.id&&p.price>0);
  main.innerHTML=
    '<h2>What would you like to do?</h2><div class="what"><button type="button" id="wBuy" aria-pressed="false"><i style="background:#2f9e44"></i>Buy wreaths</button><button type="button" id="wDon" aria-pressed="false"><i style="background:#38d9a9"></i>Donation</button></div>'+
    '<div class="sec" id="secBuy"><h2>Pick your items</h2><div class="items">'+prods.map(p=>'<div class="prod" data-p="'+esc(p.id)+'"><div class="ic">'+(ICON[p.id]||'🎄')+'</div><div class="nm"><b>'+esc(p.label)+'</b><span>'+money(p.price)+'</span></div>'+
      '<div class="step"><button type="button" class="minus" aria-label="One less '+esc(p.label)+'">−</button><output>0</output><button type="button" class="plus" aria-label="One more '+esc(p.label)+'">+</button></div></div>').join('')+'</div></div>'+
    '<div class="sec" id="secDon"><h2>Donation</h2><div class="dons">'+[5,10,20,50].map(a=>'<button type="button" data-don="'+a+'" aria-pressed="false">$'+a+'</button>').join('')+'</div>'+
    '<label class="f" style="margin-top:10px"><span>Or any amount</span><div class="dollar"><span>$</span><input id="otherAmt" type="number" inputmode="decimal" min="1" max="1000" step="1" placeholder="0"></div></label></div>'+
    '<h2>Your info</h2>'+
    '<label class="f"><span>Name</span><input id="nm" autocomplete="name" maxlength="80"></label>'+
    '<label class="f"><span>Phone</span><input id="ph" type="tel" autocomplete="tel" maxlength="30"></label>'+
    '<div class="row2"><label class="f"><span>Street address</span><input id="ad" autocomplete="street-address" maxlength="120" placeholder="123 Main St"></label><label class="f sm"><span>Apt / unit</span><input id="un" maxlength="20"></label></div>'+
    '<label class="f"><span>City</span><input id="ct" autocomplete="address-level2" maxlength="60" value="'+esc(shop.city||'')+'"></label>'+
    '<label class="f"><span>Anything we should know? (optional)</span><textarea id="nt" rows="2" maxlength="300" placeholder="Leave on the side porch, gate code, etc."></textarea></label>'+
    '<div class="hp" aria-hidden="true"><input id="web" tabindex="-1" autocomplete="off"></div>'+
    '<h2>Payment</h2><div class="pay">'+
      (shop.venmo?'<label><input type="radio" name="pay" value="venmo" checked><span><b>Pay now with Venmo</b><small>Opens Venmo with your total filled in</small></span></label>':'')+
      '<label><input type="radio" name="pay" value="later"'+(shop.venmo?'':' checked')+'><span><b>Pay when we deliver</b><small>Cash, check or Venmo at the door</small></span></label></div>'+
    '<p class="err" id="err"></p>'+
    (shop.phone?'<p class="foot">Questions? Call or text '+esc(shop.who||'us')+' at <b>'+esc(shop.phone)+'</b></p>':'')+
    '<div class="bar"><div class="in"><div class="tot"><span>Total</span><b id="tot">$0</b></div><button class="go" id="go" disabled>Place order</button></div></div>';
  main.querySelectorAll('.prod').forEach(el=>{const id=el.getAttribute('data-p');qty[id]=0;const out=el.querySelector('output');
    const set=n=>{qty[id]=Math.max(0,Math.min(20,n));out.textContent=qty[id];el.classList.toggle('on',qty[id]>0);upd()};
    el.querySelector('.minus').addEventListener('click',()=>set(qty[id]-1));el.querySelector('.plus').addEventListener('click',()=>set(qty[id]+1))});
  main.querySelectorAll('[data-don]').forEach(b=>b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';main.querySelectorAll('[data-don]').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed',String(on));don=on?+b.getAttribute('data-don'):0;document.getElementById('otherAmt').value=on?don:'';upd()}));
  document.getElementById('otherAmt').addEventListener('input',e=>{main.querySelectorAll('[data-don]').forEach(x=>x.setAttribute('aria-pressed',String(+x.getAttribute('data-don')===+e.target.value)));don=Math.max(0,Math.min(1000,+e.target.value||0));upd()});
  let buyOn=false,donOn=false;
  const tog=(btn,sec,set)=>{btn.addEventListener('click',()=>{const on=btn.getAttribute('aria-pressed')!=='true';btn.setAttribute('aria-pressed',String(on));document.getElementById(sec).classList.toggle('on',on);set(on);upd();
    if(on)setTimeout(()=>document.getElementById(sec).scrollIntoView({behavior:'smooth',block:'start'}),60)})};
  tog(document.getElementById('wBuy'),'secBuy',v=>buyOn=v);tog(document.getElementById('wDon'),'secDon',v=>donOn=v);
  ['nm','ph','ad'].forEach(id=>document.getElementById(id).addEventListener('input',upd));
  document.getElementById('go').addEventListener('click',submit);
  function upd(){const t=total();document.getElementById('tot').textContent=money(t);
    const ok=t>0&&document.getElementById('nm').value.trim()&&document.getElementById('ad').value.trim()&&document.getElementById('ph').value.trim();document.getElementById('go').disabled=!ok}
  function total(){let t=donOn?don:0;if(buyOn)prods.forEach(p=>t+=(qty[p.id]||0)*p.price);return Math.round(t*100)/100}
  async function submit(){const err=document.getElementById('err');err.textContent='';
    if(document.getElementById('web').value)return; // a bot filled the hidden box
    const items={};if(buyOn)prods.forEach(p=>{if(qty[p.id])items[p.id]=qty[p.id]});
    const pay=(main.querySelector('input[name=pay]:checked')||{}).value||'later';
    const order={shop:SHOP,season:String(shop.season||''),seller:seller,name:document.getElementById('nm').value.trim().slice(0,80),phone:document.getElementById('ph').value.trim().slice(0,30),
      addr:document.getElementById('ad').value.trim().slice(0,120),unit:document.getElementById('un').value.trim().slice(0,20),city:document.getElementById('ct').value.trim().slice(0,60),
      note:document.getElementById('nt').value.trim().slice(0,300),items,don:donOn?Math.round(don*100)/100:0,pay,total:total(),t:Date.now()};
    const go=document.getElementById('go');go.disabled=true;go.textContent='Sending...';
    try{const r=await fetch(API+'/inbox?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:toFs(order).mapValue.fields})});
      if(!r.ok)throw new Error('status '+r.status);done(order,prods)}
    catch(e){go.disabled=false;go.textContent='Place order';err.textContent='Your order didn\'t go through. Check your connection and try again.'+(shop.phone?' Or call or text '+(shop.who||'us')+' at '+shop.phone+'.':'')}}
}
function done(o,prods){
  const lines=prods.filter(p=>o.items[p.id]).map(p=>o.items[p.id]+' × '+esc(p.label)+' <span style="float:right">'+money(o.items[p.id]*p.price)+'</span>');
  if(o.don)lines.push('Donation <span style="float:right">'+money(o.don)+'</span>');
  const note='Wreaths'+(o.seller?' for '+o.seller:'')+' · '+o.name;
  const v=shop.venmo&&o.pay==='venmo'?'https://venmo.com/u/'+encodeURIComponent(String(shop.venmo).replace(/^@/,''))+'?txn=pay&amount='+o.total.toFixed(2)+'&note='+encodeURIComponent(note):'';
  document.querySelector('.bar')&&document.querySelector('.bar').remove();
  main.innerHTML='<div class="done"><div class="wreath" style="font-size:52px">🎉</div><h2>Thank you, '+esc(o.name.split(' ')[0])+'!</h2>'+
    '<p>Your order is in. '+(o.seller?esc(o.seller)+' will':'We\'ll')+' bring it to <b>'+esc(o.addr)+(o.unit?' '+esc(o.unit):'')+'</b> when wreaths arrive.</p>'+
    '<div class="sum">'+lines.join('<br>')+'<hr style="border:0;border-top:1px solid #e2ddd2;margin:8px 0"><b>Total <span style="float:right">'+money(o.total)+'</span></b></div>'+
    (v?'<a class="vbtn" href="'+v+'">Pay '+money(o.total)+' with Venmo</a><p style="font-size:14px">Venmo: '+esc(shop.venmo)+'</p>':'<p>You\'ll pay when we deliver.</p>')+
    (shop.phone?'<p class="foot">Never got your order, or have a question?<br>Call or text '+esc(shop.who||'us')+' at <b>'+esc(shop.phone)+'</b></p>':'')+'</div>';
  window.scrollTo(0,0)}
})();
</script>
</body>
</html>
